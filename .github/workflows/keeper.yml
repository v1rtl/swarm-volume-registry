# Keeper variant #2: a cron-scheduled runner, as an alternative to the
# Cloudflare Worker in js/workers/gas-boy. Same library, different failure
# profile — see services/keeper/README.md before relying on it.
#
# Two GitHub behaviours dominate everything below:
#
#   1. `schedule` only fires on the repository's DEFAULT branch. This file has
#      no effect on any other branch, whatever its cron says.
#   2. GitHub disables scheduled workflows after 60 days with no repository
#      activity, and delays them under load — often by 10+ minutes. A keeper
#      that is silently switched off is worse than one that fails loudly, so
#      treat the schedule as best-effort and size `graceBlocks` against it.
#
# The steps here stay deliberately thin. Deciding what is worth reporting needs
# to know what the cycle did, so it lives in TypeScript under services/keeper —
# including the failure notification, which fires on conditions the keeper
# understands rather than on the job's exit status.

name: keeper

permissions: {}

on:
  schedule:
    # Hourly, deliberately off the top of the hour: :00 is the busiest slot on
    # the shared scheduler and the most delayed.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Which deployment to maintain
        type: choice
        options: [sepolia, gnosis]
        default: sepolia
      dry_run:
        description: Enumerate and simulate without sending
        type: boolean
        default: false

# Never run two cycles against one wallet at once — they would race for the
# same nonce. `cancel-in-progress: false` queues instead of cancelling: killing
# a run between sending a transaction and reading its receipt is exactly the
# uncertainty a keeper should not manufacture for itself.
concurrency:
  group: keeper-${{ inputs.environment || 'sepolia' }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger volumes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Secrets and vars come from the GitHub Environment of this name, so the
    # testnet and mainnet keepers cannot share a key by accident.
    environment: ${{ inputs.environment || 'sepolia' }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # services/keeper depends on the library by path and consumes its built
      # `dist/`, which is not committed — so it has to be built before the
      # service installs, not after.
      - name: Build the keeper library
        working-directory: js
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install
        working-directory: services/keeper
        run: bun install --frozen-lockfile

      - name: Run keeper cycle
        working-directory: services/keeper
        env:
          CHAIN_ID: ${{ vars.CHAIN_ID }}
          REGISTRY_ADDRESS: ${{ vars.REGISTRY_ADDRESS }}
          # Comma-separate several from independent providers; they are tried in
          # order and each is health-checked before the cycle starts.
          RPC_URL: ${{ secrets.RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          VOLUME_IDS: ${{ vars.VOLUME_IDS }}
          MIN_BALANCE_WEI: ${{ vars.MIN_BALANCE_WEI }}
          MAX_VOLUMES_PER_CYCLE: ${{ vars.MAX_VOLUMES_PER_CYCLE }}
          CYCLE_TIMEOUT_MS: ${{ vars.CYCLE_TIMEOUT_MS }}
          FAIL_ON_WARNING: ${{ vars.FAIL_ON_WARNING }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Optional. Absent, the run reports through annotations, the job
          # summary and GitHub's own failed-run email only.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: bun run start
